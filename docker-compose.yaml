version: '3.8'

services:
  python-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight_system_app
    volumes:
      - telemetry_data_volume:/telemetry_output # Mount for telemetry data generated by the app
    ports:
      - "9090:9090/udp" # Expose UDP port for commands
    restart: unless-stopped # Ensure the application restarts unless explicitly stopped
    # Add other necessary configurations like environment variables, ports, etc.
    # depends_on: # If it needs to wait for other services like a database or message queue
    #   - openc3-redis # Example dependency

  # COSMOS Services
  # Default User/Group ID for OpenC3 services
  # You can override these in your .env file if needed
  # OPENC3_USER_ID: ${OPENC3_USER_ID:-1001}
  # OPENC3_GROUP_ID: ${OPENC3_GROUP_ID:-1001}

  openc3-minio:
    image: ${OPENC3_REGISTRY:-openc3}/openc3-minio${OPENC3_IMAGE_SUFFIX:-}:${OPENC3_TAG:-latest}
    container_name: openc3-minio
    ports:
      - "9001:9000" # MinIO API
      - "9002:9001" # MinIO Console
    volumes:
      - openc3_minio_data:/data:z
    environment:
      MINIO_ROOT_USER: ${OPENC3_BUCKET_USERNAME:-openc3}
      MINIO_ROOT_PASSWORD: ${OPENC3_BUCKET_PASSWORD:-openc3password}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  openc3-redis:
    image: ${OPENC3_REGISTRY:-openc3}/openc3-redis${OPENC3_IMAGE_SUFFIX:-}:${OPENC3_TAG:-latest}
    container_name: openc3-redis
    ports:
      - "6380:6379" # Exposing Redis on a different host port to avoid conflict if local Redis is running
    volumes:
      - openc3_redis_data:/data:z
    environment:
      REDIS_USERNAME: ${OPENC3_REDIS_USERNAME:-openc3}
      REDIS_PASSWORD: ${OPENC3_REDIS_PASSWORD:-openc3password}
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "redis://${OPENC3_REDIS_USERNAME:-openc3}:${OPENC3_REDIS_PASSWORD:-openc3password}@localhost:6379/0", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  openc3-redis-ephemeral:
    image: ${OPENC3_REGISTRY:-openc3}/openc3-redis${OPENC3_IMAGE_SUFFIX:-}:${OPENC3_TAG:-latest} # Can use the same Redis image
    container_name: openc3-redis-ephemeral
    ports:
      - "6381:6379"
    environment:
      REDIS_USERNAME: ${OPENC3_SR_REDIS_USERNAME:-openc3} # Separate credentials if needed
      REDIS_PASSWORD: ${OPENC3_SR_REDIS_PASSWORD:-openc3password}
    # No persistent volume for ephemeral Redis

  openc3-cosmos-cmd-tlm-api:
    image: ${OPENC3_REGISTRY:-openc3}/openc3-cosmos-cmd-tlm-api${OPENC3_IMAGE_SUFFIX:-}:${OPENC3_TAG:-latest}
    container_name: openc3-cosmos-cmd-tlm-api
    depends_on:
      openc3-redis:
        condition: service_healthy
      openc3-minio:
        condition: service_healthy
    ports:
      - "2901:2900" # API port
    environment:
      OPENC3_CONFIG_DIR: /openc3/config
      OPENC3_LOG_DIR: /openc3/logs
      OPENC3_TMP_DIR: /openc3/tmp
      OPENC3_USER_ID: ${OPENC3_USER_ID:-1001}
      OPENC3_GROUP_ID: ${OPENC3_GROUP_ID:-1001}
      OPENC3_REDIS_HOST: openc3-redis
      OPENC3_REDIS_PORT: 6379
      OPENC3_REDIS_USERNAME: ${OPENC3_REDIS_USERNAME:-openc3}
      OPENC3_REDIS_PASSWORD: ${OPENC3_REDIS_PASSWORD:-openc3password}
      OPENC3_REDIS_DB: 0
      OPENC3_S3_ENDPOINT: http://openc3-minio:9000
      OPENC3_S3_ACCESS_KEY_ID: ${OPENC3_BUCKET_USERNAME:-openc3}
      OPENC3_S3_SECRET_ACCESS_KEY: ${OPENC3_BUCKET_PASSWORD:-openc3password}
      OPENC3_S3_BUCKET: openc3
      OPENC3_S3_REGION: us-east-1 # Default, can be changed
      OPENC3_S3_PATH_STYLE: "true"
      OPENC3_JWT_SECRET_KEY: ${OPENC3_SERVICE_PASSWORD:-openc3password} # Use a strong, unique key in production
    volumes:
      - ./plugins:/openc3/plugins:z # Mount local plugins directory
      # cacert.pem might be needed by some plugins for SSL, mount if so
      - ./plugins/FLIGHT_SYSTEM_TARGET/config/cacert.pem:/openc3/plugins/FLIGHT_SYSTEM_TARGET/config/cacert.pem:ro

  openc3-operator:
    image: ${OPENC3_REGISTRY:-openc3}/openc3-operator${OPENC3_IMAGE_SUFFIX:-}:${OPENC3_TAG:-latest}
    container_name: openc3-operator
    depends_on:
      openc3-cosmos-cmd-tlm-api:
        condition: service_started # Or service_healthy if healthcheck is added
    ports:
      - "2902:2900" # Operator port (if it has one directly, usually accessed via Traefik)
    environment:
      OPENC3_CONFIG_DIR: /openc3/config
      OPENC3_LOG_DIR: /openc3/logs
      OPENC3_TMP_DIR: /openc3/tmp
      OPENC3_USER_ID: ${OPENC3_USER_ID:-1001}
      OPENC3_GROUP_ID: ${OPENC3_GROUP_ID:-1001}
      OPENC3_CMD_TLM_HOST: openc3-cosmos-cmd-tlm-api
      OPENC3_CMD_TLM_PORT: 2900 # Internal port for cmd-tlm-api
      OPENC3_ANYCABLE_REDIS_HOST: ${OPENC3_REDIS_HOSTNAME:-openc3-redis}
      OPENC3_ANYCABLE_REDIS_PORT: ${OPENC3_REDIS_PORT:-6379}
      OPENC3_ANYCABLE_REDIS_USERNAME: ${OPENC3_REDIS_USERNAME:-openc3}
      OPENC3_ANYCABLE_REDIS_PASSWORD: ${OPENC3_REDIS_PASSWORD:-openc3password}
      OPENC3_ANYCABLE_REDIS_DB: 1 # Separate DB for AnyCable recommended
    volumes:
      - ./plugins:/plugins:z # Mount plugins directory
      - telemetry_data_volume:/cosmos_tlm_input:z # Mount for telemetry input (read by FileInterface)
      - telemetry_archive_volume:/cosmos_tlm_archive:z # Mount for telemetry archive (written by FileInterface)
      - ./plugins/FLIGHT_SYSTEM_TARGET/config/cacert.pem:/openc3/plugins/FLIGHT_SYSTEM_TARGET/config/cacert.pem:ro


  openc3-traefik:
    image: ${OPENC3_REGISTRY:-openc3}/openc3-traefik${OPENC3_IMAGE_SUFFIX:-}:${OPENC3_TAG:-latest}
    container_name: openc3-traefik
    ports:
      - "2900:2900" # COSMOS UI HTTP
      - "2943:2943" # COSMOS UI HTTPS (if SSL enabled in Traefik)
      - "8081:8080" # Traefik Dashboard (optional, for debugging)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # To discover other containers
      - ./cosmos_config_files/openc3-traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      # - ./cosmos_config_files/openc3-traefik/dynamic_conf.yaml:/etc/traefik/dynamic_conf.yaml:ro # If using dynamic config for routers/services
    # depends_on:
    #   - openc3-operator # Traefik routes to operator, so wait for it

  openc3-cosmos-init:
    image: ${OPENC3_REGISTRY:-openc3}/openc3-cosmos-init${OPENC3_IMAGE_SUFFIX:-}:${OPENC3_TAG:-latest}
    container_name: openc3-cosmos-init
    depends_on:
      openc3-minio:
        condition: service_healthy
      openc3-redis:
        condition: service_healthy
    environment:
      OPENC3_ADMIN_USERNAME: admin
      OPENC3_ADMIN_EMAIL: admin@openc3.com
      OPENC3_ADMIN_PASSWORD: ${OPENC3_SERVICE_PASSWORD:-openc3password}
      OPENC3_S3_ENDPOINT: http://openc3-minio:9000
      OPENC3_S3_ACCESS_KEY_ID: ${OPENC3_BUCKET_USERNAME:-openc3}
      OPENC3_S3_SECRET_ACCESS_KEY: ${OPENC3_BUCKET_PASSWORD:-openc3password}
      OPENC3_S3_BUCKET: openc3
      OPENC3_S3_REGION: us-east-1
      OPENC3_S3_PATH_STYLE: "true"
      OPENC3_REDIS_HOST: openc3-redis
      OPENC3_REDIS_PORT: 6379
      OPENC3_REDIS_USERNAME: ${OPENC3_REDIS_USERNAME:-openc3}
      OPENC3_REDIS_PASSWORD: ${OPENC3_REDIS_PASSWORD:-openc3password}
      OPENC3_REDIS_DB: 0
    # This is an init container; it runs, performs setup, and exits.
    # It doesn't need to stay running. `restart: on-failure` might be useful
    # if initial setup can fail and needs retries.
    restart: "no"


volumes:
  telemetry_data_volume: # Volume for telemetry data produced by python-app, read by COSMOS
  telemetry_archive_volume: # Volume for COSMOS to archive telemetry
  openc3_minio_data:
  openc3_redis_data:
  # Other volumes for COSMOS persistence if needed
  # openc3_postgres_data:
  # openc3_influxdb_data:
  # openc3_grafana_data:
